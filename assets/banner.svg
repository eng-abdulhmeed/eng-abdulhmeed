<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <circle cx="40" cy="0" r="1.5" fill="rgba(0, 240, 255, 0.15)"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status-dot { animation: pulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid -->
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="360" rx="16" fill="url(#cyanGlow)"/>
  <rect width="1200" height="360" rx="16" fill="url(#purpleGlow)"/>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Status Badge -->
  <g transform="translate(60, 48)">
    <rect width="320" height="32" rx="16" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#10B981" class="status-dot"/>
    <circle cx="18" cy="16" r="8" fill="none" stroke="#10B981" stroke-width="1" opacity="0.3"/>
    <text x="34" y="21" fill="#34D399" font-size="12" font-weight="600" letter-spacing="1.5" class="mono">AVAILABLE FOR GLOBAL CONTRACTS</text>
  </g>

  <!-- Decorative Corner Icon -->
  <g transform="translate(1080, 42)">
    <rect width="60" height="60" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <path d="M 22 20 L 12 30 L 22 40 M 38 20 L 48 30 L 38 40 M 32 16 L 28 44" fill="none" stroke="url(#accentGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Title -->
  <text x="60" y="145" fill="url(#textGradient)" font-size="44" font-weight="800" letter-spacing="-0.5" class="sans">
    ENG. ABDULHMEED ABO-HATEM
  </text>

  <!-- Role Subtitle -->
  <text x="60" y="185" fill="#00F0FF" font-size="18" font-weight="600" letter-spacing="0.5" class="mono">
    Full-Stack Software Engineer &amp; Backend Systems Architect
  </text>

  <!-- Mission Statement -->
  <text x="60" y="222" fill="#94A3B8" font-size="15" font-weight="400" class="sans">
    Engineering resilient APIs, high-performance backends, and interactive cross-platform solutions.
  </text>

  <!-- Bottom Tech Pills / Tags -->
  <g transform="translate(60, 268)">
    <!-- Pill 1: Laravel -->
    <g transform="translate(0, 0)">
      <rect width="125" height="34" rx="8" fill="rgba(255, 45, 32, 0.08)" stroke="rgba(255, 45, 32, 0.25)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#FF2D20"/>
      <text x="28" y="22" fill="#FCA5A5" font-size="13" font-weight="600" class="mono">Laravel 12</text>
    </g>

    <!-- Pill 2: Python -->
    <g transform="translate(137, 0)">
      <rect width="180" height="34" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#38BDF8"/>
      <text x="28" y="22" fill="#BAE6FD" font-size="13" font-weight="600" class="mono">Python • FastAPI</text>
    </g>

    <!-- Pill 3: Flutter -->
    <g transform="translate(329, 0)">
      <rect width="125" height="34" rx="8" fill="rgba(2, 86, 155, 0.15)" stroke="rgba(2, 136, 209, 0.3)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#0288D1"/>
      <text x="28" y="22" fill="#90CAF9" font-size="13" font-weight="600" class="mono">Flutter Dev</text>
    </g>

    <!-- Pill 4: PostgreSQL & Redis -->
    <g transform="translate(466, 0)">
      <rect width="195" height="34" rx="8" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#8B5CF6"/>
      <text x="28" y="22" fill="#DDD6FE" font-size="13" font-weight="600" class="mono">PostgreSQL • Redis</text>
    </g>

    <!-- Pill 5: Docker -->
    <g transform="translate(673, 0)">
      <rect width="145" height="34" rx="8" fill="rgba(36, 150, 237, 0.08)" stroke="rgba(36, 150, 237, 0.25)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#2496ED"/>
      <text x="28" y="22" fill="#BAE6FD" font-size="13" font-weight="600" class="mono">Docker DevOps</text>
    </g>
  </g>

  <!-- Right Accent Tech Wave Graphic -->
  <g transform="translate(930, 150)" opacity="0.35">
    <path d="M 0 30 Q 50 -10, 100 30 T 200 30" fill="none" stroke="#00F0FF" stroke-width="2"/>
    <path d="M 0 50 Q 50 10, 100 50 T 200 50" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
    <path d="M 0 70 Q 50 30, 100 70 T 200 70" fill="none" stroke="#38BDF8" stroke-width="1"/>
  </g>
</svg>
