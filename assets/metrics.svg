<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="cardBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="purpleText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Left Card: Engineering Pillars -->
  <g transform="translate(0, 0)">
    <rect width="585" height="240" rx="14" fill="url(#cardBg)" stroke="url(#cardBorder1)" stroke-width="1.5"/>
    
    <!-- Header -->
    <path d="M 28 32 L 34 38 L 28 44" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="44" y="41" fill="url(#cyanText)" font-size="14" font-weight="700" letter-spacing="1" class="mono">CORE ENGINEERING PILLARS</text>
    <line x1="28" y1="56" x2="557" y2="56" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

    <!-- Items -->
    <g transform="translate(28, 86)">
      <circle cx="6" cy="0" r="3" fill="#00F0FF"/>
      <text x="22" y="4" fill="#E2E8F0" font-size="14" font-weight="600" class="sans">Scalable Backend Architecture</text>
      <text x="22" y="22" fill="#94A3B8" font-size="12" class="sans">RESTful APIs, microservices, and asynchronous task pipelines.</text>
    </g>

    <g transform="translate(28, 138)">
      <circle cx="6" cy="0" r="3" fill="#38BDF8"/>
      <text x="22" y="4" fill="#E2E8F0" font-size="14" font-weight="600" class="sans">High-Performance Data Modeling</text>
      <text x="22" y="22" fill="#94A3B8" font-size="12" class="sans">Normalized schema design in PostgreSQL &amp; Redis caching.</text>
    </g>

    <g transform="translate(28, 190)">
      <circle cx="6" cy="0" r="3" fill="#10B981"/>
      <text x="22" y="4" fill="#E2E8F0" font-size="14" font-weight="600" class="sans">Automated Bot &amp; Cloud Workflows</text>
      <text x="22" y="22" fill="#94A3B8" font-size="12" class="sans">Real-time Telegram bot services containerized with Docker.</text>
    </g>
  </g>

  <!-- Right Card: System Stack Highlights -->
  <g transform="translate(615, 0)">
    <rect width="585" height="240" rx="14" fill="url(#cardBg)" stroke="url(#cardBorder2)" stroke-width="1.5"/>

    <!-- Header -->
    <path d="M 28 32 L 34 38 L 28 44" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="44" y="41" fill="url(#purpleText)" font-size="14" font-weight="700" letter-spacing="1" class="mono">SYSTEM CAPABILITIES &amp; METRICS</text>
    <line x1="28" y1="56" x2="557" y2="56" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

    <!-- Row 1 -->
    <g transform="translate(28, 86)">
      <rect width="250" height="42" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <text x="16" y="18" fill="#64748B" font-size="10" font-weight="600" class="mono">BACKEND FRAMEWORKS</text>
      <text x="16" y="34" fill="#F8FAFC" font-size="13" font-weight="600" class="mono">Laravel 12 • FastAPI</text>
    </g>
    <g transform="translate(298, 86)">
      <rect width="259" height="42" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <text x="16" y="18" fill="#64748B" font-size="10" font-weight="600" class="mono">CLIENT PLATFORMS</text>
      <text x="16" y="34" fill="#F8FAFC" font-size="13" font-weight="600" class="mono">Flutter • React • Canvas</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(28, 148)">
      <rect width="250" height="42" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <text x="16" y="18" fill="#64748B" font-size="10" font-weight="600" class="mono">DATABASES &amp; CACHE</text>
      <text x="16" y="34" fill="#F8FAFC" font-size="13" font-weight="600" class="mono">PostgreSQL • MySQL • Redis</text>
    </g>
    <g transform="translate(298, 148)">
      <rect width="259" height="42" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <text x="16" y="18" fill="#64748B" font-size="10" font-weight="600" class="mono">INFRASTRUCTURE</text>
      <text x="16" y="34" fill="#F8FAFC" font-size="13" font-weight="600" class="mono">Docker • Nginx • Linux CI/CD</text>
    </g>
  </g>
</svg>
